org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP 9 compatibility for Flutter plugins still applying the Kotlin plugin.
# Remove these opt-outs only after every native plugin supports the new DSL
# and built-in Kotlin. Flutter 3.47 explicitly supports this migration path.
android.builtInKotlin=false
android.newDsl=false
