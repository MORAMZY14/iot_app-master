name: iot
description: "IoT-Smart-Home."
publish_to: 'none'

version: 2.12.0+47

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter

  # Exact versions preserve the existing resolved baseline during pruning.
  # Firebase
  firebase_core: 3.15.2
  firebase_auth: 5.7.0
  firebase_database: 11.3.10


  # State Management
  flutter_riverpod: 2.6.1

  # Storage / Preferences
  shared_preferences: 2.5.5
  path_provider: 2.1.6

  # Network / HTTP
  http: 1.6.0
  wifi_iot: 0.3.19+2
  flutter_blue_plus: 1.36.8

  # UI
  shimmer: 3.0.0

  # Media / Files
  file_picker: 10.3.10
  just_audio: 0.9.46
  audio_session: 0.1.25
  path: 1.9.1

  # Permissions
  permission_handler: 12.0.3

  # Ellie bilingual voice assistant
  speech_to_text: 7.4.0
  flutter_tts: 4.2.5
  # Imported Gemma `.task` models run on the phone; no model URL or API key.
  flutter_gemma: 0.16.5
  llamadart: 0.8.22

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: 4.0.0
  flutter_launcher_icons: 0.13.1

flutter:
  uses-material-design: true
  # Several required native plugins still use CocoaPods. Prevent Flutter 3.44+
  # from rewriting this iOS project for Swift Package Manager during CI.
  config:
    enable-swift-package-manager: false
    enable-uiscene-migration: false
# The source logo is used only to generate native launcher icons. Screenshot
# and photo assets are intentionally excluded from the runtime Flutter bundle.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"

# Qwen uses llama.cpp. Gemma's existing plugin owns LiteRT-LM, so bundling
# llamadart's extra LiteRT-LM runtime would create duplicate native libraries.
hooks:
  user_defines:
    llamadart:
      llamadart_native_runtimes:
        - llama_cpp
